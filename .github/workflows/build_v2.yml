name: Build WindowsiOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Apply iPhone 15 Patches and Build
        run: |
          python3 -c '
          import glob

          # 1. Replace HingeSensorView.swift with clean dummy implementation for non-foldable iPhone 15
          with open("ios/Sources/HingeSensorView.swift", "w") as f:
              f.write("""import SwiftUI
          import UIKit

          struct HingeSensorView: UIViewRepresentable {
              var onAngleChange: ((Double) -> Void)?
              func makeUIView(context: Context) -> UIView { UIView(frame: .zero) }
              func updateUIView(_ uiView: UIView, context: Context) {}
          }
          """)

          # 2. Lower default RAM allocation for iPhone 15 (6GB RAM)
          for path in glob.glob("ios/**/*.*", recursive=True) + glob.glob("core/**/*.*", recursive=True):
              try:
                  with open(path, "r") as f:
                      c = f.read()
                  c2 = c.replace("4608", "2560").replace("4500", "2560").replace("4096", "2560")
                  c2 = c2.replace("4 * 1024 * 1024 * 1024", "2560 * 1024 * 1024")
                  c2 = c2.replace("4294967296", "2684354560").replace("4831838208", "2684354560")
                  if c != c2:
                      print("Patched RAM in:", path)
                      with open(path, "w") as f:
                          f.write(c2)
              except Exception:
                  pass
          '
          cd ios
          if [ -f "project.yml" ]; then
            brew install xcodegen
            xcodegen generate
          fi
          PROJ=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          SCHEME=$(xcodebuild -list -project "$PROJ" | awk '/Schemes:/{getline; print $1; exit}')
          set -o pipefail
          xcodebuild -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee build.log || {
              echo "=== ERROR SUMMARY ==="
              grep -E "error:|fatal error:|Undefined symbols|ld:" build.log | tail -n 20
              exit 1
            }

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/build -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r WindowsiOS.ipa Payload

      - name: Upload WindowsiOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: WindowsiOS-IPA
          path: WindowsiOS.ipa
