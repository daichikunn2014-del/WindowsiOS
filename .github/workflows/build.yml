name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect ios folder and Build
        run: |
          echo "=== Files in repository ==="
          find . -maxdepth 4 -not -path '*/.*'

          # もし ios/Package.swift や ios/*.xcodeproj があればそれを使う
          if [ -f "ios/Package.swift" ]; then
            echo "Found ios/Package.swift"
          fi

          # Bridging Header を自動検索
          BRIDGING_HEADER=$(find . -name "*Bridging-Header.h" -o -name "WinIOSBridge.h" | head -n 1)
          echo "Found header: $BRIDGING_HEADER"

          brew install xcodegen

          cat << EOF > project.yml
          name: WindowsiOS
          options:
            bundleIdPrefix: com.windowsios
          targets:
            WindowsiOS:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources:
                - path: ios/Sources
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.windowsios.app
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait"
                  SWIFT_OBJC_BRIDGING_HEADER: "$BRIDGING_HEADER"
                  HEADER_SEARCH_PATHS: "\$(inherited) \$(SRCROOT)/ios/Sources \$(SRCROOT)/ios/Sources/include \$(SRCROOT)/src \$(SRCROOT)/include"
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""
          EOF

          xcodegen generate

          xcodebuild -project WindowsiOS.xcodeproj \
            -scheme WindowsiOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r WindowsiOS.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WindowsiOS-IPA
          path: WindowsiOS.ipa
