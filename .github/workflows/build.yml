name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository structure and Build
        run: |
          echo "=== Files in repository ==="
          find . -maxdepth 3
          
          PROJECT_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          WORKSPACE_FILE=$(find . -name "*.xcworkspace" | grep -v "project.xcworkspace" | head -n 1)
          
          if [ -n "$WORKSPACE_FILE" ]; then
            echo "Found workspace: $WORKSPACE_FILE"
            SCHEME_NAME=$(xcodebuild -list -workspace "$WORKSPACE_FILE" | awk '/Schemes:/{getline; print $1}')
            xcodebuild -workspace "$WORKSPACE_FILE" \
              -scheme "$SCHEME_NAME" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          elif [ -n "$PROJECT_FILE" ]; then
            echo "Found project: $PROJECT_FILE"
            SCHEME_NAME=$(xcodebuild -list -project "$PROJECT_FILE" | awk '/Schemes:/{getline; print $1}')
            xcodebuild -project "$PROJECT_FILE" \
              -scheme "$SCHEME_NAME" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          else
            echo "No xcodeproj found. Trying Swift Package / xcodebuild directly..."
            SCHEME_NAME=$(xcodebuild -list | awk '/Schemes:/{getline; print $1}')
            xcodebuild -scheme "$SCHEME_NAME" \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" | head -n 1)
          echo "Found app: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r WindowsiOS.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WindowsiOS-IPA
          path: WindowsiOS.ipa
