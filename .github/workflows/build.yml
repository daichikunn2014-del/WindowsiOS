name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect files and Generate Xcode Project
        run: |
          echo "=== Repository Files ==="
          find . -maxdepth 4 -not -path '*/.*'
          
          brew install xcodegen
          
          cat << 'EOF' > project.yml
          name: WindowsiOS
          options:
            bundleIdPrefix: com.windowsios
          targets:
            WindowsiOS:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources:
                - path: .
                  excludes:
                    - "**/*.md"
                    - "**/*.txt"
                    - "**/*.sh"
                    - "**/*.py"
                    - "**/*.yml"
                    - "**/*.yaml"
                    - "LICENSE*"
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.windowsios.app
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait"
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""
          EOF
          
          xcodegen generate

      - name: Build Unsigned App
        run: |
          xcodebuild -project WindowsiOS.xcodeproj \
            -scheme WindowsiOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r WindowsiOS.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WindowsiOS-IPA
          path: WindowsiOS.ipa
